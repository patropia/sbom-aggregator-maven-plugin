version: 2
updates:
  # Maven dependencies and build plugins (pom.xml).
  - package-ecosystem: 'maven'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    # The plugin compiles against the Maven 3.9 API (provided scope); Maven
    # Resolver 2.x and newer Maven API lines would silently raise the minimum
    # Maven version users need. Bump those deliberately, not via Dependabot.
    ignore:
      - dependency-name: 'org.apache.maven.resolver:*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'org.apache.maven:*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      maven-plugins:
        patterns:
          - 'org.apache.maven.plugins:*'
          - 'org.apache.maven.plugin-tools:*'
          - 'org.apache.maven.resolver:*'
          - 'org.sonatype.central:*'
      test-dependencies:
        patterns:
          - 'org.junit*:*'
          - 'org.jacoco:*'

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns:
          - '*'
