name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Superseded runs on the same ref are cancelled to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum supported runtime (enforced by maven-enforcer-plugin),
        # 21 is the current LTS and guards against future breakage.
        java: [ '17', '21' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Build with Maven (unit + integration tests)
        run: mvn -B -ntp clean verify -Prun-its

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/invoker-reports/
          retention-days: 30

      - name: Upload Coverage Reports
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-java-${{ matrix.java }}
          path: target/site/jacoco/
          retention-days: 30
